openapi: 3.0.3
info:
  title: Identity Service API
  description: >
    Registration, login, JWT issuance, and refresh token management.
    Owns IdentityDb only — no other service reads from or writes to this data (ADR 0001).
  version: "1.0"

servers:
  - url: /identity
    description: >
      Reached through the API Gateway from Phase 4 onward. Direct access to this
      service's own port is expected in Phases 1–3 only.

tags:
  - name: Auth
    description: Registration, login, token lifecycle
  - name: Health
    description: Liveness/readiness

paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      operationId: registerUser
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          headers:
            Location:
              description: URL of the new user resource
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email already registered
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Exchange credentials for an access token and refresh token
      operationId: login
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Invalid email or password
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a valid refresh token for a new access token
      description: >
        Rotates the refresh token — the one submitted is revoked and a new one
        is issued alongside the new access token. Does not require a bearer token;
        the refresh token itself is the credential.
      operationId: refreshToken
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Refresh token invalid, expired, or already revoked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/revoke:
    post:
      tags: [Auth]
      summary: Revoke a refresh token (logout)
      description: >
        Deliberately does not require a valid bearer token — the refresh token being
        revoked is the credential. Requiring a live access token here would make it
        impossible to log out with an already-expired session, which defeats the point.
      operationId: revokeToken
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Revoked — no content
        '401':
          description: Refresh token invalid or already revoked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Return the identity of the currently authenticated caller
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Access token missing, expired, or invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /health:
    get:
      tags: [Health]
      summary: Readiness probe target — what the Kubernetes readiness probe checks (Phase 5+)
      operationId: getHealth
      responses:
        '200':
          description: Ready to serve traffic

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: >
        Propagated across every service call and included in every log line (§13).
        If omitted, the service generates one and returns it in a response header
        of the same name — don't assume the caller always sets it.
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: One or more fields failed validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, confirmPassword]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 10
          description: Enforced by FluentValidation server-side, not just this schema — min 10 chars, at least one number.
        confirmPassword:
          type: string
          format: password

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    TokenResponse:
      type: object
      required: [accessToken, refreshToken, expiresAtUtc]
      properties:
        accessToken:
          type: string
          description: Short-lived JWT (15 min) — sent as a bearer token to every other service, directly in Phases 1–3, via the gateway from Phase 4 on.
        refreshToken:
          type: string
          description: Long-lived, single-use — rotated on every /refresh call.
        expiresAtUtc:
          type: string
          format: date-time

    UserResponse:
      type: object
      required: [userId, email, createdAtUtc]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        createdAtUtc:
          type: string
          format: date-time

    ProblemDetails:
      type: object
      description: RFC 7807 — what the global exception middleware (§10) maps every thrown exception and typed failure to.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        correlationId:
          type: string
          format: uuid

    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
