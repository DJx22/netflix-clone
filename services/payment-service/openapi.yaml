openapi: 3.0.3
info:
  title: Payment Service API
  description: >
    Mock billing and invoices. Owns PaymentDb only (ADR 0001). No real Stripe
    integration — an in-process simulator, so the service can be tested without
    a network dependency. Publishes PaymentCompleted to RabbitMQ on success;
    that event, not this endpoint's response, is what Subscription actually waits on.
  version: "1.0"

servers:
  - url: /payments
    description: Reached through the API Gateway from Phase 4 onward; direct port access in Phases 1–3 only.

tags:
  - name: Payments
  - name: Health

paths:
  /api/v1/payments:
    get:
      tags: [Payments]
      summary: List the caller's payment history
      operationId: listPayments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Payment history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentResponse'
    post:
      tags: [Payments]
      summary: Submit a mock payment
      description: >
        simulateFailure is a testing-only field with no equivalent in a real payment
        gateway integration — it exists so both the success and failure paths (and what
        Subscription does with each) can be tested deterministically from Postman,
        instead of waiting on a random outcome. If omitted, the outcome is randomized.
      operationId: createPayment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: >
            Mock charge processed — status Succeeded or Failed either way. 201 here
            means the charge attempt completed, not that a subscription is active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/v1/payments/{paymentId}:
    get:
      tags: [Payments]
      summary: Get one payment/invoice
      operationId: getPayment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Payment detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '404':
          description: No payment with that ID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /health:
    get:
      tags: [Health]
      summary: Readiness probe target (Phase 5+)
      operationId: getHealth
      responses:
        '200':
          description: Ready to serve traffic

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Propagated across every service call and included in every log line (§13). Generated by the service if the caller omits it.
      schema:
        type: string
        format: uuid
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: One or more fields failed validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'

  schemas:
    CreatePaymentRequest:
      type: object
      required: [subscriptionId, amount, currency]
      properties:
        subscriptionId: { type: string, format: uuid }
        amount: { type: number, format: float }
        currency: { type: string, description: 'ISO 4217, e.g. "USD"' }
        simulateFailure:
          type: boolean
          description: Testing-only. Omit for a randomized outcome.

    PaymentResponse:
      type: object
      required: [paymentId, subscriptionId, amount, currency, status, processedAtUtc]
      properties:
        paymentId: { type: string, format: uuid }
        subscriptionId: { type: string, format: uuid }
        amount: { type: number, format: float }
        currency: { type: string }
        status:
          type: string
          enum: [Succeeded, Failed]
        processedAtUtc: { type: string, format: date-time }

    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string, format: uuid }

    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
