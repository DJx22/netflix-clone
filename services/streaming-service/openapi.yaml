openapi: 3.0.3
info:
  title: Streaming/Playback Service API
  description: >
    Manifest lookup and playback-position tracking. Azurite for assets, Redis for
    position. This spec covers the JSON API only — actual video byte-serving happens
    via HTTP range requests directly against the manifest URL this API returns, not
    through a path defined here (Streaming ≠ video engineering, roadmap §9).
  version: "1.0"

servers:
  - url: /playback
    description: Reached through the API Gateway from Phase 4 onward; direct port access in Phases 1–3 only.

tags:
  - name: Playback
  - name: Health

paths:
  /api/v1/playback/{titleId}/manifest:
    get:
      tags: [Playback]
      summary: Get the manifest location to start playback for a title
      operationId: getManifest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/TitleId'
      responses:
        '200':
          description: Manifest info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestResponse'
        '404':
          description: No manifest for that title
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/playback/{titleId}/position:
    get:
      tags: [Playback]
      summary: Get the saved position for a profile on a title
      description: >
        profileId is trusted from the query string, not validated against the caller's
        account via a call to the Profile service — a deliberate scope cut, not an
        oversight. In a real system this is a genuine gap: any authenticated caller
        can read or write any profile's position by guessing a profileId. Contrast
        with Profile's own endpoints, which do check ownership (403 vs 404).
      operationId: getPosition
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/TitleId'
        - name: profileId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Playback position
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackPositionResponse'
        '404':
          description: No saved position for this profile/title pair
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      tags: [Playback]
      summary: Save the current position for a profile on a title
      operationId: savePosition
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/TitleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePositionRequest'
      responses:
        '204':
          description: Saved
        '400':
          $ref: '#/components/responses/ValidationError'

  /health:
    get:
      tags: [Health]
      summary: Readiness probe target (Phase 5+)
      operationId: getHealth
      responses:
        '200':
          description: Ready to serve traffic

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Propagated across every service call and included in every log line (§13). Generated by the service if the caller omits it.
      schema:
        type: string
        format: uuid
    TitleId:
      name: titleId
      in: path
      required: true
      schema:
        type: string

  responses:
    ValidationError:
      description: One or more fields failed validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'

  schemas:
    ManifestResponse:
      type: object
      required: [titleId, manifestUrl, durationSeconds]
      properties:
        titleId: { type: string }
        manifestUrl:
          type: string
          format: uri
          description: Azurite blob URL in local dev; a real CDN/Blob URL from Phase 9 on.
        durationSeconds: { type: integer }

    PlaybackPositionResponse:
      type: object
      required: [titleId, profileId, positionSeconds, updatedAtUtc]
      properties:
        titleId: { type: string }
        profileId: { type: string, format: uuid }
        positionSeconds: { type: integer }
        updatedAtUtc: { type: string, format: date-time }

    SavePositionRequest:
      type: object
      required: [profileId, positionSeconds]
      properties:
        profileId: { type: string, format: uuid }
        positionSeconds: { type: integer, minimum: 0 }

    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string, format: uuid }

    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
