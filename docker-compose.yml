name: netflix-clone

services:
  identity-service:
    image: ${IDENTITY_IMAGE:-identity-service:test}
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile.identity.service
    environment:
      ASPNETCORE_URLS: http://+:5001
      ConnectionStrings__IdentityDb: ${IDENTITY_DB_CONNECTION:-Server=sqlserver,1433;Database=IdentityDb;User Id=sa;Password=${SA_PASSWORD:-YourStr0ngPassw0rd!};TrustServerCertificate=True}
      Jwt__Issuer: ${JWT_ISSUER:-netflix-clone}
      Jwt__Audience: ${JWT_AUDIENCE:-netflix-clone-api}
      Jwt__Secret: ${JWT_SECRET:-local-development-secret-change-me-32-chars}
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':1389 ' /proc/net/tcp /proc/net/tcp6 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      sqlserver:
        condition: service_healthy

  profile-service:
    image: ${PROFILE_IMAGE:-profile-service:test}
    build:
      context: ./services/profile-service
      dockerfile: Dockerfile.profile.service
    environment:
      ASPNETCORE_URLS: http://+:5002
      ConnectionStrings__ProfileDb: ${PROFILE_DB_CONNECTION:-Server=sqlserver,1433;Database=ProfileDb;User Id=sa;Password=${SA_PASSWORD:-YourStr0ngPassw0rd!};TrustServerCertificate=True}
      Jwt__Issuer: ${JWT_ISSUER:-netflix-clone}
      Jwt__Audience: ${JWT_AUDIENCE:-netflix-clone-api}
      Jwt__Secret: ${JWT_SECRET:-local-development-secret-change-me-32-chars}
    ports:
      - "5002:5002"
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':138A ' /proc/net/tcp /proc/net/tcp6 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      sqlserver:
        condition: service_healthy

  catalog-service:
    image: ${CATALOG_IMAGE:-catalog-service:test}
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile.catalog.service
    environment:
      ASPNETCORE_URLS: http://+:5005
      MongoDb__ConnectionString: ${CATALOG_MONGO_CONNECTION:-mongodb://mongodb:27017}
      MongoDb__DatabaseName: ${CATALOG_MONGO_DATABASE:-CatalogDb}
      MongoDb__TitlesCollectionName: titles
      Jwt__Issuer: ${JWT_ISSUER:-netflix-clone}
      Jwt__Audience: ${JWT_AUDIENCE:-netflix-clone-api}
      Jwt__Secret: ${JWT_SECRET:-local-development-secret-change-me-32-chars}
    ports:
      - "5005:5005"
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':138D ' /proc/net/tcp /proc/net/tcp6 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      mongodb:
        condition: service_healthy

  subscription-service:
    image: ${SUBSCRIPTION_IMAGE:-subscription-service:test}
    build:
      context: ./services/subscription-service
      dockerfile: Dockerfile.subscription.service
    environment:
      ASPNETCORE_URLS: http://+:5003
      ConnectionStrings__SubscriptionDb: ${SUBSCRIPTION_DB_CONNECTION:-Server=sqlserver,1433;Database=SubscriptionDb;User Id=sa;Password=${SA_PASSWORD:-YourStr0ngPassw0rd!};TrustServerCertificate=True}
      Jwt__Issuer: ${JWT_ISSUER:-netflix-clone}
      Jwt__Audience: ${JWT_AUDIENCE:-netflix-clone-api}
      Jwt__Secret: ${JWT_SECRET:-local-development-secret-change-me-32-chars}
      # Phase 4: RabbitMQ consumer — uses service-name DNS inside the Compose network.
      RabbitMq__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMq__UserName: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASS:-guest}
    ports:
      - "5003:5003"
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':138B ' /proc/net/tcp /proc/net/tcp6 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment-service:
    image: ${PAYMENT_IMAGE:-payment-service:test}
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile.payment.service
    environment:
      ASPNETCORE_URLS: http://+:5004
      ConnectionStrings__PaymentDb: ${PAYMENT_DB_CONNECTION:-Server=sqlserver,1433;Database=PaymentDb;User Id=sa;Password=${SA_PASSWORD:-YourStr0ngPassw0rd!};TrustServerCertificate=True}
      # Phase 4: SubscriptionService__BaseUrl removed — Payment no longer calls
      # Subscription over HTTP.  The event path via RabbitMQ replaces the HTTP bridge.
      Jwt__Issuer: ${JWT_ISSUER:-netflix-clone}
      Jwt__Audience: ${JWT_AUDIENCE:-netflix-clone-api}
      Jwt__Secret: ${JWT_SECRET:-local-development-secret-change-me-32-chars}
      # Phase 4: RabbitMQ publisher — uses service-name DNS inside the Compose network.
      RabbitMq__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMq__UserName: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASS:-guest}
    ports:
      - "5004:5004"
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':138C ' /proc/net/tcp /proc/net/tcp6 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      sqlserver:
        condition: service_healthy
      # Phase 4: depends_on subscription-service removed — Payment no longer needs
      # Subscription to be up at startup.  The broker decouples the two services.
      rabbitmq:
        condition: service_healthy

  streaming-service:
    image: ${STREAMING_IMAGE:-streaming-service:test}
    build:
      context: ./services/streaming-service
      dockerfile: Dockerfile.streaming.service
    environment:
      ASPNETCORE_URLS: http://+:5006
      ConnectionStrings__StreamingDb: ${STREAMING_DB_CONNECTION:-Server=sqlserver,1433;Database=StreamingDb;User Id=sa;Password=${SA_PASSWORD:-YourStr0ngPassw0rd!};TrustServerCertificate=True}
      CatalogClient__BaseUrl: ${CATALOG_SERVICE_URL:-http://catalog-service:5005}
      Jwt__Issuer: ${JWT_ISSUER:-netflix-clone}
      Jwt__Audience: ${JWT_AUDIENCE:-netflix-clone-api}
      Jwt__Secret: ${JWT_SECRET:-local-development-secret-change-me-32-chars}
    ports:
      - "5006:5006"
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':138E ' /proc/net/tcp /proc/net/tcp6 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      sqlserver:
        condition: service_healthy
      catalog-service:
        condition: service_started
      azurite:
        condition: service_started

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-YourStr0ngPassw0rd!}
    ports:
      - "1401:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/1433'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data

  # ── Phase 4: RabbitMQ message broker ─────────────────────────────────────────
  # rabbitmq:3-management ships the management plugin at port 15672 — no extra
  # image tag needed.  Credentials are injected via env vars so they are easy to
  # override in CI without touching this file.  The named volume persists the
  # Mnesia database across container restarts, which prevents message loss during
  # local development cycles.
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      # AMQP protocol port — used by Payment publisher and Subscription consumer.
      - "5672:5672"
      # Management UI — reachable at http://localhost:15672 after `docker compose up`.
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # rabbitmq-diagnostics ping is the canonical lightweight liveness probe;
      # it exercises the Erlang node without requiring a full broker start.
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  sqlserver-data:
  mongodb-data:
  azurite-data:
  rabbitmq-data:
